[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[project]
name = "quantum-developer-agentic-honeypot-scam-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "google-generativeai>=0.8.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "pgvector>=0.5.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pypdf>=5.1.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "redis>=5.0",
    "sentry-sdk[fastapi]>=2.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.40.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
]

[project.optional-dependencies]
# Imported by app/models/hf_models.py; optional so the API runs without them.
ml = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
]
# Phase 10: sentence-transformers/all-MiniLM-L6-v2 embedding classifier
# (packages/ml/text/semantic.py). Separate from `ml` above -- that extra
# gates the zero-shot/spam HF pipelines behind DEPLOYMENT_MODE=full; this one
# is its own opt-in so a deployment can run the semantic classifier without
# the rest of the HF pipeline stack, or vice versa. Pulls in torch itself
# (sentence-transformers' own dependency) -- [tool.uv.sources]/[tool.uv.index]
# below pin it to PyTorch's CPU-only wheel index so this doesn't drag in a
# multi-GB CUDA build on a machine with no GPU to use it.
semantic = [
    "sentence-transformers>=3.0.0",
]
# Local OCR (packages/ingestion/image/__init__.py) -- a fast, deterministic,
# no-network-call text extraction path that runs before the gateway vision
# LLM call, not instead of it. EasyOCR over pytesseract because it's pure
# Python (no system Tesseract binary to install/deploy) and reuses the same
# CPU-only torch wheel already pulled in by `semantic` above -- no new
# runtime dependency category, same "small, no GPU/heavy download" bar
# packages/ml/text/supervised.py's own scikit-learn choice was held to.
ocr = [
    "easyocr>=1.7.0",
    # Declared directly (not just easyocr's transitive dep) so
    # [tool.uv.sources]'s pytorch-cpu pin actually applies to it -- uv only
    # honors a source override for packages named in a dependency table.
    # Without this, uv resolved torchvision from plain PyPI, whose wheel's
    # compiled _C extension doesn't load against the pytorch-cpu torch build
    # (silently, per torchvision/extension.py's except-and-return-False), so
    # torchvision::nms was never registered and easyocr's import crashed with
    # RuntimeError -- OCR always unavailable, screenshots never transcribed.
    "torchvision>=0.20.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.8.0",
    "black>=26.1.0",
    "fakeredis>=2.37.0",
    "freezegun>=1.5.1",
    "mypy>=1.19.1",
    "pip-audit>=2.7.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.14",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101 assert_used: fine outside prod hot paths in this codebase.
# B104 hardcoded_bind_all_interfaces: apps/api/main.py's uvicorn.run(host="0.0.0.0")
#   is required to be reachable inside its ECS/Fargate container (phase 15's
#   architecture) -- exposure is controlled by the ALB/security group in front
#   of it, not by what this process binds to internally.
# B105 hardcoded_password_string: false-positive on this codebase's constant
#   string *prefixes* (a header name, a token-format marker) that contain
#   "secret"/"token" as a substring but hold no secret value -- verified real
#   secrets never appear as literals (tests/security/test_auth.py asserts it
#   for the one place a literal secret used to live).
# B311 blacklist (random module): every use here is non-cryptographic jitter
#   for honeypot persona realism (typing delay, emotion selection, stalling
#   tactic choice) -- actual credential generation
#   (packages/shared/security/api_keys.py) uses `secrets`, never `random`.
skips = ["B101", "B104", "B105", "B311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "characterization: records current behavior; failure means behavior changed",
]

[tool.coverage.run]
source = ["apps", "packages"]

[tool.ruff]
line-length = 100
src = ["apps", "packages", "tests"]

[tool.mypy]
files = ["apps", "packages"]
ignore_missing_imports = true

