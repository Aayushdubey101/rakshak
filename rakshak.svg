<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients for a modern, sleek aesthetic -->
    <linearGradient id="redGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="redGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="greyGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="greyGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Cyber/Tech Accent Lines -->
  <line x1="70" y1="360" x2="140" y2="315" stroke="#94a3b8" stroke-width="2" />
  <line x1="430" y1="360" x2="360" y2="315" stroke="#94a3b8" stroke-width="2" />
  <line x1="120" y1="80" x2="170" y2="140" stroke="#94a3b8" stroke-width="2" />
  <line x1="380" y1="80" x2="330" y2="140" stroke="#94a3b8" stroke-width="2" />
  <line x1="250" y1="480" x2="250" y2="495" stroke="#94a3b8" stroke-width="2" />

  <!-- Outer Red Shield -->
  <!-- Left Wing -->
  <path d="M 235 370 L 100 240 L 120 120 L 190 140 L 210 200 L 160 220 L 210 280 Z" fill="url(#redGradLeft)" />
  <!-- Right Wing -->
  <path d="M 265 370 L 400 240 L 380 120 L 310 140 L 290 200 L 340 220 L 290 280 Z" fill="url(#redGradRight)" />

  <!-- Inner Spartan/Guardian Helmet -->
  <!-- Helmet Crest/Top Left -->
  <path d="M 245 60 L 215 130 L 245 150 Z" fill="url(#greyGradLeft)" />
  <!-- Helmet Crest/Top Right -->
  <path d="M 255 60 L 285 130 L 255 150 Z" fill="url(#greyGradRight)" />
  
  <!-- Helmet Face Left -->
  <path d="M 245 160 L 185 160 L 205 270 L 245 340 Z" fill="url(#greyGradLeft)" />
  <!-- Helmet Face Right -->
  <path d="M 255 160 L 315 160 L 295 270 L 255 340 Z" fill="url(#greyGradRight)" />

  <!-- Main Title: RAKSHAK -->
  <text x="250" y="430" font-family="'Trebuchet MS', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="6">RAKSHAK</text>
  
  <!-- Subtitle: YOUR DIGITAL GUARDIAN -->
  <text x="250" y="460" font-family="'Trebuchet MS', 'Arial', sans-serif" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle" letter-spacing="3">YOUR DIGITAL GUARDIAN</text>
</svg>
