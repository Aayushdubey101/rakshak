<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap');
    body { margin: 0; font-family: Archivo, system-ui, -apple-system, sans-serif; }
    a { color: #ae1800; } a:hover { color: #7c1405; }

    @keyframes go-spin { to { transform: rotate(360deg); } }
    @keyframes go-spin-rev { to { transform: rotate(-360deg); } }
    @keyframes go-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes go-breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .45; } 50% { transform: translate(-50%, -50%) scale(1.14); opacity: .85; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .stage {
      position: relative;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f4f3f3 46%, #efeeee 100%);
      color: #605d5d;
      overflow: hidden;
    }
    .rings { position: absolute; inset: 0; }
    .scan {
      position: absolute;
      left: 299px; top: 38px;
      width: 2px; height: 262px;
      background: linear-gradient(to top, rgba(236, 48, 19, 0), rgba(236, 48, 19, .55));
      transform-origin: 50% 100%;
      animation: go-spin 14s linear infinite;
    }

    .outer { position: absolute; inset: 0; animation: go-spin 46s linear infinite; }
    .inner-ring { position: absolute; inset: 0; animation: go-spin-rev 60s linear infinite; }

    .badge {
      position: absolute;
      width: 58px; height: 58px;
      transform: translate(-50%, -50%);
    }
    .badge-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(45, 43, 43, .18), 0 1px 3px rgba(45, 43, 43, .12);
      animation: go-spin-rev 46s linear infinite;
    }
    .badge-inner.dark { background: #201e1d; color: #f8f4f4; }
    .badge svg { width: 26px; height: 26px; }

    .node {
      position: absolute;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      transform: translate(-50%, -50%);
      animation: go-spin 60s linear infinite;
    }
    .node svg { width: 24px; height: 24px; }

    .core {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      text-align: center;
      width: 260px;
    }
    .core-glow {
      position: absolute;
      left: 50%; top: 34px;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 48, 19, .30) 0%, rgba(236, 48, 19, 0) 70%);
      animation: go-breathe 3.6s ease-in-out infinite;
    }
    .core svg.mark { width: 108px; height: 108px; position: relative; }
    .wm {
      font-weight: 800;
      font-size: 33px;
      letter-spacing: .1em;
      color: #201e1d;
      line-height: 1;
    }
    .wm-sub {
      font-weight: 700;
      font-size: 10px;
      letter-spacing: .34em;
      color: #ae1800;
      line-height: 1;
    }
  </style>
</helmet>

  <div class="scan"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

  </div>

  <div class="core">
    <div class="core-glow"></div>
